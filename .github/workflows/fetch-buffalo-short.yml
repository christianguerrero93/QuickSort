name: Fetch Buffalo Short
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet yt-dlp
      - name: Locate n-signature implementation
        run: |
          ROOT="$(python - <<'PY'
          import pathlib, yt_dlp
          print(pathlib.Path(yt_dlp.__file__).parent)
          PY
          )"
          echo "ROOT=$ROOT"
          grep -RIn --include='*.py' -E 'decrypt_nsig|nsig|n_function|jsc' "$ROOT/extractor/youtube" "$ROOT" | head -300
