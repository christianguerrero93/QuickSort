name: Fetch Buffalo Short

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download Short through public frontends
        run: |
          set -u
          VIDEO_ID='IipXNXmLfSs'
          : > attempts.log
          rm -f metadata.json source.mp4

          try_stream_url() {
            local STREAM_URL="$1"
            local REFERER="${2:-https://www.youtube.com/}"
            [ -n "$STREAM_URL" ] || return 1
            echo "Trying selected media URL" >> attempts.log
            ffmpeg -hide_banner -loglevel warning -y \
              -headers "Referer: ${REFERER}\r\nUser-Agent: Mozilla/5.0\r\n" \
              -i "$STREAM_URL" -an -c:v libx264 -preset veryfast -crf 21 \
              -movflags +faststart source.mp4 >> attempts.log 2>&1
            test -s source.mp4
          }

          PIPED_APIS=(
            'https://pipedapi.kavin.rocks'
            'https://pipedapi.tokhmi.xyz'
            'https://pipedapi.moomoo.me'
            'https://pipedapi.syncpundit.io'
            'https://api-piped.mha.fi'
            'https://piped-api.garudalinux.org'
            'https://pipedapi.rivo.lol'
          )

          for BASE in "${PIPED_APIS[@]}"; do
            echo "Piped: $BASE" >> attempts.log
            if curl -A 'Mozilla/5.0' -fsSL --connect-timeout 10 --max-time 45 \
                "$BASE/streams/$VIDEO_ID" -o candidate.json 2>> attempts.log; then
              if jq -e '.videoStreams | type == "array" and length > 0' candidate.json >/dev/null 2>&1; then
                cp candidate.json metadata.json
                mapfile -t URLS < <(jq -r '
                  [.videoStreams[]
                    | select(.url != null)
                    | . + {qnum: ((.quality // "0") | capture("(?<n>[0-9]+)").n? // "0" | tonumber)}]
                  | sort_by((if .qnum <= 720 then 1 else 0 end), .qnum, (.bitrate // 0))
                  | reverse
                  | .[].url' candidate.json)
                for STREAM_URL in "${URLS[@]}"; do
                  rm -f source.mp4
                  if try_stream_url "$STREAM_URL" "$BASE/"; then
                    break 2
                  fi
                done
              fi
            fi
          done

          if [ ! -s source.mp4 ]; then
            INVIDIOUS=(
              'https://inv.nadeko.net'
              'https://invidious.nerdvpn.de'
              'https://yt.chocolatemoo53.com'
              'https://invidious.tiekoetter.com'
            )
            for BASE in "${INVIDIOUS[@]}"; do
              echo "Invidious: $BASE" >> attempts.log
              if curl -A 'Mozilla/5.0' -fsSL --connect-timeout 10 --max-time 45 \
                  "$BASE/api/v1/videos/$VIDEO_ID?local=true" -o candidate.json 2>> attempts.log; then
                if jq -e '((.formatStreams // []) + (.adaptiveFormats // [])) | length > 0' candidate.json >/dev/null 2>&1; then
                  cp candidate.json metadata.json
                  mapfile -t URLS < <(jq -r '
                    [((.formatStreams // []) + (.adaptiveFormats // []))[]
                      | select(.url != null)
                      | select((.type // .mimeType // "video") | startswith("video"))
                      | . + {h: (.height // 0)}]
                    | sort_by((if .h <= 720 then 1 else 0 end), .h, (.bitrate // 0))
                    | reverse
                    | .[].url' candidate.json)
                  for STREAM_URL in "${URLS[@]}"; do
                    rm -f source.mp4
                    if try_stream_url "$STREAM_URL" "$BASE/"; then
                      break 2
                    fi
                  done
                fi
              fi
            done
          fi

          test -s source.mp4
          ffprobe -v error -show_entries format=duration,size -of json source.mp4 > media-info.json

      - name: Make final-section preview GIF
        if: success()
        run: |
          set -euxo pipefail
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source.mp4)"
          START="$(python -c "print(max(0, float('$DURATION') - 7.0))")"
          ffmpeg -y -ss "$START" -i source.mp4 -vf "fps=12,scale=480:-1:flags=lanczos,palettegen=stats_mode=diff" palette.png
          ffmpeg -y -ss "$START" -i source.mp4 -i palette.png -lavfi "fps=12,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a" -loop 0 last-seven-seconds.gif

      - name: Upload media and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-short-media
          path: |
            source.mp4
            metadata.json
            media-info.json
            last-seven-seconds.gif
            attempts.log
            candidate.json
          if-no-files-found: warn
          retention-days: 1
