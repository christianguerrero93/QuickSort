name: Fetch Buffalo Short

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          python -m pip install --upgrade pip yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Short
        run: |
          set -euxo pipefail
          URL='https://youtube.com/shorts/IipXNXmLfSs?is=-seLpb4RqP2kCPnU'
          yt-dlp \
            --no-playlist \
            --js-runtimes node \
            --remote-components ejs:github \
            -f 'bv*[height<=720]+ba/b[height<=720]/b' \
            --merge-output-format mp4 \
            --write-info-json \
            -o 'downloaded.%(ext)s' \
            "$URL"
          VIDEO="$(find . -maxdepth 1 -type f \( -name 'downloaded.mp4' -o -name 'downloaded.webm' -o -name 'downloaded.mkv' \) | head -n1)"
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -c:v libx264 -preset veryfast -crf 22 -c:a aac -movflags +faststart source.mp4
          mv downloaded.info.json metadata.json

      - name: Make final-section preview GIF
        run: |
          set -euxo pipefail
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source.mp4)"
          START="$(python -c "print(max(0, float('$DURATION') - 6.0))")"
          ffmpeg -y -ss "$START" -i source.mp4 -vf "fps=12,scale=480:-1:flags=lanczos,palettegen=stats_mode=diff" palette.png
          ffmpeg -y -ss "$START" -i source.mp4 -i palette.png -lavfi "fps=12,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a" -loop 0 last-six-seconds.gif
          ffprobe -v error -show_entries format=duration,size -of json source.mp4 > media-info.json

      - name: Upload media
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-short-media
          path: |
            source.mp4
            metadata.json
            media-info.json
            last-six-seconds.gif
          retention-days: 1
