name: Fetch Buffalo Short

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Download official final-frame storyboard
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageDraw

          url = ('https://i.ytimg.com/sb/IipXNXmLfSs/storyboard3_L0/default.jpg'
                 '?sqp=-oaymwENSDfyq4qpAwVwAcABBqLzl_8DBgiAwPHSBg=='
                 '&sigh=rs%24AOn4CLArGAuy9rKiFyz0DQHUJrpA6kUJMQ')
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://www.youtube.com/shorts/IipXNXmLfSs',
          })
          with urllib.request.urlopen(req, timeout=45) as response:
              data = response.read()
          Path('storyboard.jpg').write_bytes(data)

          sheet = Image.open('storyboard.jpg').convert('RGB')
          tile_w, tile_h, frame_count, cols, rows = 48, 27, 100, 10, 10
          tiles = []
          for idx in range(frame_count):
              x = (idx % cols) * tile_w
              y = (idx // cols) * tile_h
              tiles.append(sheet.crop((x, y, x + tile_w, y + tile_h)))

          # Labeled enlargement of all frames for choosing the exact tongue sequence.
          scale = 6
          contact = Image.new('RGB', (cols * tile_w * scale, rows * tile_h * scale), 'black')
          draw = ImageDraw.Draw(contact)
          for idx, tile in enumerate(tiles):
              enlarged = tile.resize((tile_w * scale, tile_h * scale), Image.Resampling.NEAREST)
              x = (idx % cols) * tile_w * scale
              y = (idx // cols) * tile_h * scale
              contact.paste(enlarged, (x, y))
              draw.text((x + 3, y + 3), str(idx), fill='white', stroke_width=2, stroke_fill='black')
          contact.save('storyboard-contact.png')

          # Broad ending preview; this will be refined locally after visual inspection.
          start_idx = 55
          preview_tiles = tiles[start_idx:]
          frames = [t.resize((480, 270), Image.Resampling.LANCZOS) for t in preview_tiles]
          frames[0].save(
              'storyboard-ending.gif', save_all=True, append_images=frames[1:],
              duration=150, loop=0, optimize=False)
          Path('storyboard-metadata.json').write_text(json.dumps({
              'url': url,
              'sheet_size': list(sheet.size),
              'tile_size': [tile_w, tile_h],
              'frame_count': frame_count,
              'preview_start_index': start_idx,
          }, indent=2))
          PY
      - name: Upload storyboard frames
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-storyboard
          path: |
            storyboard.jpg
            storyboard-contact.png
            storyboard-ending.gif
            storyboard-metadata.json
          retention-days: 1
