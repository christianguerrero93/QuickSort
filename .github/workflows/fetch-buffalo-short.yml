name: Fetch Buffalo Short

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          python -m pip install --quiet selenium

      - name: Extract and download the Short
        env:
          DISPLAY: ':99'
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x900x24 >xvfb.log 2>&1 &
          sleep 2
          cat > extract.py <<'PY'
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          VIDEO_ID = 'IipXNXmLfSs'
          options = Options()
          options.binary_location = '/usr/bin/google-chrome'
          for arg in [
              '--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu',
              '--mute-audio', '--window-size=1280,900', '--lang=en-US',
              '--disable-blink-features=AutomationControlled',
              '--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
              '(KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          ]:
              options.add_argument(arg)
          options.add_experimental_option('excludeSwitches', ['enable-automation'])
          options.add_experimental_option('useAutomationExtension', False)

          driver = webdriver.Chrome(options=options)
          driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {
              'source': "Object.defineProperty(navigator, 'webdriver', {get: () => undefined});"
          })
          try:
              driver.get(f'https://www.youtube.com/shorts/{VIDEO_ID}')
              deadline = time.time() + 60
              source = ''
              while time.time() < deadline:
                  source = driver.page_source
                  if 'var ytInitialPlayerResponse = ' in source and '"streamingData"' in source:
                      break
                  time.sleep(0.5)
              Path('shorts-page.html').write_text(source)
              marker = 'var ytInitialPlayerResponse = '
              if marker not in source:
                  driver.save_screenshot('browser-error.png')
                  raise RuntimeError('ytInitialPlayerResponse was not found')
              start = source.index(marker) + len(marker)
              response, _ = json.JSONDecoder().raw_decode(source[start:])
              formats = response.get('streamingData', {}).get('formats', [])
              direct = [f for f in formats if f.get('url')]
              if not direct:
                  driver.save_screenshot('browser-error.png')
                  raise RuntimeError('No progressive media URL was present')
              chosen = max(direct, key=lambda f: (f.get('height', 0), f.get('bitrate', 0)))
              Path('stream-url.txt').write_text(chosen['url'])
              Path('metadata.json').write_text(json.dumps({
                  'video_id': VIDEO_ID,
                  'title': response.get('videoDetails', {}).get('title'),
                  'lengthSeconds': response.get('videoDetails', {}).get('lengthSeconds'),
                  'chosen_format': {k: chosen.get(k) for k in [
                      'itag', 'qualityLabel', 'width', 'height', 'fps', 'bitrate', 'mimeType', 'contentLength'
                  ]},
                  'playabilityStatus': response.get('playabilityStatus', {}),
                  'storyboards': response.get('storyboards', {}),
              }, indent=2))
          finally:
              driver.quit()
          PY
          python extract.py
          STREAM_URL="$(cat stream-url.txt)"
          ffmpeg -hide_banner -loglevel warning -y \
            -headers $'Referer: https://www.youtube.com/\r\nUser-Agent: Mozilla/5.0\r\n' \
            -i "$STREAM_URL" -an -c:v libx264 -preset veryfast -crf 18 \
            -pix_fmt yuv420p -movflags +faststart source.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height \
            -of json source.mp4 > media-info.json

      - name: Make final-section GIF
        run: |
          set -euxo pipefail
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source.mp4)"
          START="$(python -c "print(max(0, float('$DURATION') - 5.5))")"
          ffmpeg -y -ss "$START" -i source.mp4 -vf "fps=15,scale=480:-1:flags=lanczos,palettegen=stats_mode=diff" palette.png
          ffmpeg -y -ss "$START" -i source.mp4 -i palette.png -lavfi "fps=15,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a" -loop 0 buffalo-last-portion.gif
          ffmpeg -y -ss "$START" -i source.mp4 -t 5.5 -c:v libx264 -an -movflags +faststart final-preview.mp4

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-short-media
          path: |
            source.mp4
            metadata.json
            media-info.json
            buffalo-last-portion.gif
            final-preview.mp4
            shorts-page.html
            browser-error.png
            xvfb.log
          if-no-files-found: warn
          retention-days: 1
