name: Fetch Buffalo Short

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          python -m pip install --quiet selenium pillow

      - name: Capture final seconds in Chrome
        env:
          DISPLAY: ':99'
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x900x24 >xvfb.log 2>&1 &
          sleep 2
          cat > capture.py <<'PY'
          import http.server
          import json
          import math
          import os
          import socketserver
          import threading
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          VIDEO_ID = 'IipXNXmLfSs'
          FPS = 12
          CLIP_SECONDS = 9
          frames_dir = Path('frames')
          frames_dir.mkdir(exist_ok=True)
          diagnostics = []

          web_dir = Path('web')
          web_dir.mkdir(exist_ok=True)
          (web_dir / 'index.html').write_text(f'''<!doctype html>
          <html><body style="margin:0;background:#000;overflow:hidden">
          <iframe id="yt" width="960" height="540" style="border:0"
            src="https://www.youtube.com/embed/{VIDEO_ID}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1&origin=http://127.0.0.1:8765"
            allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
          </body></html>''')

          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *args):
                  pass

          handler = lambda *args, **kwargs: QuietHandler(*args, directory=str(web_dir), **kwargs)
          server = socketserver.ThreadingTCPServer(('127.0.0.1', 8765), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          options = Options()
          options.binary_location = '/usr/bin/google-chrome'
          for arg in [
              '--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu',
              '--mute-audio', '--autoplay-policy=no-user-gesture-required',
              '--window-size=1280,900', '--hide-scrollbars', '--lang=en-US',
              '--disable-blink-features=AutomationControlled',
              '--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
              '(KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          ]:
              options.add_argument(arg)
          options.add_experimental_option('excludeSwitches', ['enable-automation'])
          options.add_experimental_option('useAutomationExtension', False)

          driver = webdriver.Chrome(options=options)
          driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {
              'source': "Object.defineProperty(navigator, 'webdriver', {get: () => undefined});"
          })

          def accept_consent():
              for selector in [
                  "button[aria-label='Accept all']",
                  "button[aria-label='Reject all']",
                  "button[aria-label*='Accept']",
              ]:
                  try:
                      button = driver.find_element(By.CSS_SELECTOR, selector)
                      if button.is_displayed():
                          button.click()
                          time.sleep(1)
                  except Exception:
                      pass

          def locate_video(mode):
              if mode == 'embed':
                  driver.get('http://127.0.0.1:8765/index.html')
                  time.sleep(2)
                  frame = driver.find_element(By.ID, 'yt')
                  driver.switch_to.frame(frame)
              elif mode == 'watch':
                  driver.get(f'https://www.youtube.com/watch?v={VIDEO_ID}&autoplay=1')
                  accept_consent()
              else:
                  driver.get(f'https://www.youtube.com/shorts/{VIDEO_ID}')
                  accept_consent()

              deadline = time.time() + 50
              video = None
              while time.time() < deadline:
                  try:
                      videos = driver.find_elements(By.TAG_NAME, 'video')
                      if videos:
                          video = max(videos, key=lambda e: e.size.get('width', 0) * e.size.get('height', 0))
                          state = driver.execute_script('''
                            const v=arguments[0];
                            v.muted=true; v.volume=0; v.play().catch(()=>{});
                            const p=document.getElementById('movie_player');
                            return {
                              duration: Number.isFinite(v.duration) ? v.duration : 0,
                              ready: v.readyState,
                              current: v.currentTime || 0,
                              error: v.error ? v.error.message : null,
                              videoId: p && p.getVideoData ? p.getVideoData().video_id : null,
                              title: document.title,
                              body: document.body ? document.body.innerText.slice(0, 500) : ''
                            };
                          ''', video)
                          if state['duration'] > 0 and state['ready'] >= 2 and (not state['videoId'] or state['videoId'] == VIDEO_ID):
                              return video, state
                  except Exception:
                      pass
                  time.sleep(0.5)
              raise RuntimeError('video never became playable')

          success = False
          try:
              for mode in ['embed', 'watch', 'shorts']:
                  try:
                      driver.switch_to.default_content()
                      video, state = locate_video(mode)
                      duration = float(state['duration'])
                      start = max(0.0, duration - CLIP_SECONDS)
                      driver.execute_script('''
                        const v=arguments[0];
                        v.muted=true; v.volume=0; v.currentTime=arguments[1];
                        v.play().catch(()=>{});
                      ''', video, start)

                      deadline = time.time() + 20
                      while time.time() < deadline:
                          current, ready = driver.execute_script(
                              'return [arguments[0].currentTime, arguments[0].readyState];', video)
                          if current >= max(0, start - 0.4) and ready >= 2:
                              break
                          time.sleep(0.1)

                      capture_start = time.monotonic()
                      total = int(CLIP_SECONDS * FPS)
                      for i in range(total):
                          target = capture_start + i / FPS
                          delay = target - time.monotonic()
                          if delay > 0:
                              time.sleep(delay)
                          video.screenshot(str(frames_dir / f'frame_{i:04d}.png'))

                      end_time = driver.execute_script('return arguments[0].currentTime;', video)
                      metadata = {
                          'capture_method': f'chrome_{mode}',
                          'video_id': VIDEO_ID,
                          'duration': duration,
                          'capture_start': start,
                          'capture_end': end_time,
                          'fps': FPS,
                          'frames': total,
                          'element_size': video.size,
                      }
                      Path('metadata.json').write_text(json.dumps(metadata, indent=2))
                      success = True
                      break
                  except Exception as exc:
                      diagnostics.append({'mode': mode, 'error': repr(exc), 'url': driver.current_url})
                      try:
                          driver.switch_to.default_content()
                          driver.save_screenshot(f'browser-{mode}-error.png')
                          Path(f'browser-{mode}-source.html').write_text(driver.page_source)
                      except Exception:
                          pass
              if not success:
                  raise RuntimeError(json.dumps(diagnostics))
          finally:
              Path('browser-diagnostics.json').write_text(json.dumps(diagnostics, indent=2))
              driver.quit()
              server.shutdown()
          PY
          python capture.py
          ffmpeg -hide_banner -loglevel warning -y -framerate 12 -i frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart source.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height \
            -of json source.mp4 > media-info.json

      - name: Make preview GIF
        run: |
          ffmpeg -y -i source.mp4 -vf "fps=12,scale=600:-1:flags=lanczos,palettegen=stats_mode=diff" palette.png
          ffmpeg -y -i source.mp4 -i palette.png -lavfi "fps=12,scale=600:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a" -loop 0 final-capture.gif

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-short-media
          path: |
            source.mp4
            metadata.json
            media-info.json
            final-capture.gif
            browser-diagnostics.json
            browser-*-error.png
            browser-*-source.html
            frames/frame_0000.png
            frames/frame_0024.png
            frames/frame_0048.png
            frames/frame_0072.png
            frames/frame_0107.png
            xvfb.log
          if-no-files-found: warn
          retention-days: 1
